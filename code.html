<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Garden Letter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Homemade+Apple&family=Shadows+Into+Light&family=Quicksand:wght@400;500;600;700&display=swap');

:root{
  --paper:#FFFBF3;
  --seal:#E1728F;
  --font-letter:'Caveat', cursive;
  --ink:#3d4a30;
  --sky-top:#FDF1E0;
  --sky-bottom:#FCE3EC;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  min-height:100vh;
  font-family:'Quicksand',sans-serif;
  color:var(--ink);
  position:relative;
}

/* ---------- SKY & GARDEN BACKGROUND ---------- */
.sky{
  position:fixed; inset:0;
  background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 55%, #F6E9D8 100%);
  z-index:-3;
}
.sun{
  position:fixed; top:6%; right:9%;
  width:110px; height:110px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #FFF6D0, #FFE28A 60%, #FFD966 100%);
  box-shadow:0 0 60px 20px rgba(255,217,102,0.45);
  z-index:-3;
  animation:pulse 6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

.cloud{
  position:fixed; background:#fff; border-radius:50px; opacity:0.75; z-index:-3;
  box-shadow:0 0 0 0 #fff;
  animation:drift linear infinite;
}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
@keyframes drift{from{transform:translateX(-140px);}to{transform:translateX(calc(100vw + 140px));}}

.hill{
  position:fixed; left:0; right:0; bottom:0; height:34vh; z-index:-2;
  background:linear-gradient(180deg,#BFE3A6 0%, #9BCE85 45%, #7FBB6C 100%);
  border-radius:50% 50% 0 0 / 18% 18% 0 0;
}
.hill::before{
  content:''; position:absolute; inset:0 0 auto 0; height:14px;
  background:linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
}

.flower-field{
  position:fixed; left:0; right:0; bottom:0; height:34vh; z-index:-1; overflow:visible;
}
.grass{
  position:absolute; bottom:0; width:2px; border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,#8FC773,#5F9E4A);
  transform-origin:bottom center;
  animation:swayGrass 3.2s ease-in-out infinite;
}
@keyframes swayGrass{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}

.flower{
  position:absolute; bottom:0; transform-origin:bottom center;
  animation:bloom 900ms cubic-bezier(.2,1.4,.4,1) both, sway 4.5s ease-in-out infinite;
}
.flower .stem{
  position:absolute; bottom:0; left:50%; width:3px; transform:translateX(-50%);
  background:linear-gradient(180deg,#6FA758,#4C8036); border-radius:2px;
}
.flower .bloom{position:absolute; left:50%; top:0; transform:translate(-50%,-50%);}
.flower .petal{
  position:absolute; left:50%; top:50%;
  border-radius:60% 60% 60% 60% / 70% 70% 30% 30%;
  background:hsl(var(--hue) 70% 78%);
  transform-origin:0% 100%;
}
.flower .center{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  border-radius:50%; background:radial-gradient(circle at 35% 35%,#FFF3B0,#FFCB4F);
  box-shadow:0 0 0 1px rgba(0,0,0,0.03);
}
.flower.dot .petal{background:hsl(var(--hue) 65% 88%);}
@keyframes bloom{from{transform:scale(0) rotate(-14deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
@keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}

.butterfly{
  position:fixed; z-index:0; font-size:22px; pointer-events:none;
  animation:flutter 14s linear infinite, bob 1.2s ease-in-out infinite;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.15));
}
@keyframes bob{0%,100%{margin-top:0;}50%{margin-top:-10px;}}
@keyframes flutter{
  0%{transform:translate(-10vw,40vh) rotate(0deg);}
  25%{transform:translate(30vw,15vh) rotate(8deg);}
  50%{transform:translate(60vw,45vh) rotate(-6deg);}
  75%{transform:translate(85vw,20vh) rotate(6deg);}
  100%{transform:translate(110vw,40vh) rotate(0deg);}
}

.petal-fall{
  position:fixed; top:-30px; z-index:0; pointer-events:none; font-size:16px; opacity:0.85;
  animation:fall linear forwards;
}
@keyframes fall{
  to{ transform:translate(var(--drift,40px), 108vh) rotate(360deg); opacity:0.2; }
}

/* ---------- APP LAYOUT ---------- */
.app{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:36px 20px 80px;}
.title-bar{text-align:center; margin-bottom:28px;}
.title-bar h1{
  font-family:'Caveat',cursive; font-size:clamp(2.4rem,5vw,3.4rem); margin:0 0 4px;
  color:#4a6b3a; text-shadow:0 2px 0 rgba(255,255,255,0.6);
}
.title-bar p{margin:0; font-size:0.95rem; color:#5b6b52;}

.workspace{
  display:flex; gap:28px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
}

.panel{
  background:rgba(255,255,255,0.72); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.8);
  border-radius:20px; padding:20px; width:250px; flex:0 0 250px;
  box-shadow:0 10px 30px -12px rgba(80,60,40,0.25);
}
.panel h3{
  font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em;
  color:#7a8a68; margin:18px 0 10px; font-weight:700;
}
.panel h3:first-child{margin-top:0;}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{
  width:30px; height:30px; border-radius:50%; border:2px solid rgba(255,255,255,0.9);
  cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:transform .15s;
}
.swatch:hover{transform:scale(1.12);}
.swatch.active{outline:2px solid #4a6b3a; outline-offset:2px;}

.font-options{display:flex; flex-direction:column; gap:6px;}
.font-btn{
  padding:8px 10px; border-radius:12px; border:1px solid #e3ddc9; background:#fff;
  cursor:pointer; font-size:1.05rem; text-align:left; transition:all .15s;
}
.font-btn.active{border-color:#4a6b3a; background:#eef5e6;}

.sticker-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
.sticker-btn{
  font-size:1.3rem; background:#fff; border:1px solid #eee2c9; border-radius:10px;
  padding:6px 0; cursor:pointer; transition:transform .12s;
}
.sticker-btn:hover{transform:scale(1.15) rotate(-6deg);}

.panel-actions{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
.btn{
  font-family:'Quicksand',sans-serif; font-weight:600; font-size:0.85rem;
  padding:10px 12px; border-radius:14px; border:none; cursor:pointer;
  background:#4a6b3a; color:#fff; transition:transform .15s, box-shadow .15s;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 14px -6px rgba(74,107,58,0.5);}
.btn.secondary{background:#fff; color:#4a6b3a; border:1px solid #4a6b3a;}

.letter-stage{flex:1 1 480px; display:flex; justify-content:center;}

.letter-wrap{position:relative;}
.letter{
  position:relative; width:min(560px,88vw); min-height:600px;
  background:var(--paper); border-radius:4px; padding:56px 42px 40px;
  box-shadow:0 30px 60px -20px rgba(60,40,20,0.35), 0 2px 0 rgba(0,0,0,0.03) inset;
  transition:background .4s ease;
  font-family:var(--font-letter);
}
.letter::before{
  content:''; position:absolute; inset:0; border-radius:4px;
  background:repeating-linear-gradient(180deg, transparent, transparent 37px, rgba(0,0,0,0.035) 38px);
  pointer-events:none;
}
.seal{
  position:absolute; top:-26px; left:50%; transform:translateX(-50%) rotate(-4deg);
  width:56px; height:56px; border-radius:50%; background:var(--seal);
  display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#fff;
  box-shadow:0 6px 12px -4px rgba(0,0,0,0.4), inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.35);
  transition:background .4s ease;
}
.field{
  outline:none; font-size:1.5rem; line-height:1.5; color:var(--ink); position:relative; z-index:1;
}
.field[data-placeholder]:empty:before{content:attr(data-placeholder); color:#9aa08a; opacity:0.7;}
.to-field{margin-bottom:6px;}
.message-field{min-height:260px; margin:10px 0 18px;}
.from-field{text-align:right;}

.sticker-layer{position:absolute; inset:0; z-index:2; pointer-events:none;}
.sticker{
  position:absolute; font-size:30px; cursor:grab; user-select:none; touch-action:none;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,0.18));
  pointer-events:auto;
}
.sticker:active{cursor:grabbing;}

.hint{
  text-align:center; font-size:0.78rem; color:#7a8a68; margin-top:14px; opacity:0.85;
}

@media (max-width:780px){
  .workspace{flex-direction:column; align-items:center;}
  .panel{width:100%; max-width:560px; flex:none;}
}
</style>
</head>
<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="hill"></div>
<div class="flower-field" id="flowerField"></div>
<div id="butterflies"></div>

<div class="app">
  <div class="title-bar">
    <h1>🌸 A Garden Letter 🌸</h1>
    <p>Write something lovely, dress it up with blooms, and send it with love.</p>
  </div>

  <div class="workspace">
    <aside class="panel">
      <h3>Paper colour</h3>
      <div class="swatches" id="paperSwatches"></div>

      <h3>Handwriting style</h3>
      <div class="font-options" id="fontOptions"></div>

      <h3>Wax seal colour</h3>
      <div class="swatches" id="sealSwatches"></div>

      <h3>Stickers</h3>
      <div class="sticker-grid" id="stickerGrid"></div>

      <div class="panel-actions">
        <button class="btn" id="downloadBtn">🌷 Save letter as image</button>
        <button class="btn secondary" id="clearStickersBtn">Clear stickers</button>
        <button class="btn secondary" id="resetBtn">Reset everything</button>
      </div>
    </aside>

    <main class="letter-stage">
      <div class="letter-wrap">
        <div class="letter" id="letter">
          <div class="seal" id="seal">🌿</div>
          <div class="field to-field" id="toField" contenteditable="true" data-placeholder="Dear friend,"></div>
          <div class="field message-field" id="messageField" contenteditable="true" data-placeholder="Let your words bloom here... write whatever your heart wants to share."></div>
          <div class="field from-field" id="fromField" contenteditable="true" data-placeholder="With love, you"></div>
          <div class="sticker-layer" id="stickerLayer"></div>
        </div>
      </div>
      <p class="hint">Tap a sticker to add it, drag to move it, double-tap to remove it 🦋</p>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ---------------- GARDEN BACKGROUND ---------------- */
const field = document.getElementById('flowerField');
const hues = [340, 320, 280, 40, 10, 200, 0];

function makePetalFlower(x, hue, size, isDot){
  const flower = document.createElement('div');
  flower.className = 'flower' + (isDot ? ' dot' : '');
  const stemH = 30 + Math.random()*40;
  flower.style.left = x + 'px';
  flower.style.animationDelay = (Math.random()*1.2)+'s, '+(Math.random()*3)+'s';
  flower.style.height = (stemH + size) + 'px';
  flower.style.width = size*2 + 'px';
  flower.style.setProperty('--hue', hue);

  const stem = document.createElement('div');
  stem.className = 'stem';
  stem.style.height = stemH + 'px';
  flower.appendChild(stem);

  const bloom = document.createElement('div');
  bloom.className = 'bloom';
  bloom.style.bottom = stemH + 'px';
  bloom.style.left = '50%';

  const petalCount = isDot ? 5 : 6;
  const petalW = size * (isDot ? 0.5 : 0.62);
  const petalH = size * (isDot ? 0.7 : 0.95);
  for(let i=0;i<petalCount;i++){
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.width = petalW + 'px';
    petal.style.height = petalH + 'px';
    petal.style.transform = `rotate(${i*(360/petalCount)}deg) translate(-50%,-100%)`;
    bloom.appendChild(petal);
  }
  const center = document.createElement('div');
  center.className = 'center';
  const cs = size*0.34;
  center.style.width = cs+'px';
  center.style.height = cs+'px';
  bloom.appendChild(center);

  flower.appendChild(bloom);
  return flower;
}

function plantFlower(x){
  const isDot = Math.random() < 0.35;
  const size = isDot ? 8 + Math.random()*6 : 14 + Math.random()*12;
  const hue = hues[Math.floor(Math.random()*hues.length)];
  const f = makePetalFlower(x, hue, size, isDot);
  field.appendChild(f);
  if(field.children.length > 140){ field.removeChild(field.firstChild); }
}

function plantGrass(x){
  const g = document.createElement('div');
  g.className = 'grass';
  g.style.left = x + 'px';
  g.style.height = (16 + Math.random()*22) + 'px';
  g.style.animationDelay = (Math.random()*3)+'s';
  field.appendChild(g);
}

function seedGarden(){
  const w = window.innerWidth;
  for(let i=0;i<70;i++) plantGrass(Math.random()*w);
  for(let i=0;i<48;i++) plantFlower(Math.random()*w);
}
seedGarden();
window.addEventListener('resize', () => {
  field.innerHTML='';
  seedGarden();
});

field.addEventListener('click', (e)=>{
  plantFlower(e.clientX);
});

/* clouds */
const skyEl = document.querySelector('.sky');
for(let i=0;i<4;i++){
  const c = document.createElement('div');
  c.className = 'cloud';
  const w = 80 + Math.random()*70, h = w*0.42;
  c.style.width = w+'px'; c.style.height = h+'px';
  c.style.top = (5 + Math.random()*22) + 'vh';
  c.style.animationDuration = (40 + Math.random()*30) + 's';
  c.style.animationDelay = (-Math.random()*40) + 's';
  document.body.appendChild(c);
}

/* butterflies */
const bWrap = document.getElementById('butterflies');
const bEmojis = ['🦋','🐝'];
for(let i=0;i<3;i++){
  const b = document.createElement('div');
  b.className = 'butterfly';
  b.textContent = bEmojis[i % bEmojis.length];
  b.style.animationDuration = (12 + Math.random()*8)+'s, 1s';
  b.style.animationDelay = (-Math.random()*10)+'s, '+(Math.random())+'s';
  bWrap.appendChild(b);
}

/* falling petals */
const fallEmojis = ['🌸','🌺','🍃'];
setInterval(()=>{
  const p = document.createElement('div');
  p.className = 'petal-fall';
  p.textContent = fallEmojis[Math.floor(Math.random()*fallEmojis.length)];
  p.style.left = (Math.random()*100)+'vw';
  p.style.setProperty('--drift', (Math.random()*80-40)+'px');
  p.style.animationDuration = (7+Math.random()*5)+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 13000);
}, 2600);

/* ---------------- LETTER CUSTOMIZATION ---------------- */
const root = document.documentElement;

const paperColors = ['#FFFBF3','#FDE2E9','#EDE3F7','#E1F1E2','#E4EEFB','#FFF3D6'];
const sealColors = ['#E1728F','#C4444F','#6B9A5E','#D9A441','#9B7FC0','#4A6B3A'];
const fonts = [
  {label:'Caveat', value:"'Caveat', cursive"},
  {label:'Shadows Into Light', value:"'Shadows Into Light', cursive"},
  {label:'Homemade Apple', value:"'Homemade Apple', cursive"}
];
const stickerEmojis = ['🌸','🌷','🌻','🌼','🌹','💐','🦋','🐝','🐞','🌿','🍃','✨','💛','💌','🕊️','🍄','🌈','☀️','🐌','🪻'];

function buildSwatches(container, colors, varName, sealEl){
  colors.forEach((color, i)=>{
    const btn = document.createElement('button');
    btn.className = 'swatch' + (i===0 ? ' active':'');
    btn.style.background = color;
    btn.title = color;
    btn.addEventListener('click', ()=>{
      root.style.setProperty(varName, color);
      container.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
    });
    container.appendChild(btn);
  });
}
buildSwatches(document.getElementById('paperSwatches'), paperColors, '--paper');
buildSwatches(document.getElementById('sealSwatches'), sealColors, '--seal');

const fontContainer = document.getElementById('fontOptions');
fonts.forEach((f, i)=>{
  const btn = document.createElement('button');
  btn.className = 'font-btn' + (i===0 ? ' active':'');
  btn.style.fontFamily = f.value;
  btn.textContent = 'Aa — ' + f.label;
  btn.addEventListener('click', ()=>{
    root.style.setProperty('--font-letter', f.value);
    fontContainer.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
  fontContainer.appendChild(btn);
});

const stickerGrid = document.getElementById('stickerGrid');
const stickerLayer = document.getElementById('stickerLayer');
const letter = document.getElementById('letter');

stickerEmojis.forEach(emoji=>{
  const btn = document.createElement('button');
  btn.className = 'sticker-btn';
  btn.textContent = emoji;
  btn.addEventListener('click', ()=> addSticker(emoji));
  stickerGrid.appendChild(btn);
});

function addSticker(emoji){
  const el = document.createElement('div');
  el.className = 'sticker';
  el.textContent = emoji;
  const rect = letter.getBoundingClientRect();
  const x = rect.width*0.25 + Math.random()*rect.width*0.5;
  const y = rect.height*0.2 + Math.random()*rect.height*0.5;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.transform = `rotate(${Math.random()*30-15}deg)`;
  makeDraggable(el);
  el.addEventListener('dblclick', ()=> el.remove());
  stickerLayer.appendChild(el);
}

function makeDraggable(el){
  let offsetX=0, offsetY=0, dragging=false;
  el.addEventListener('pointerdown', (e)=>{
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    offsetX = e.clientX - r.left;
    offsetY = e.clientY - r.top;
  });
  el.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const lr = letter.getBoundingClientRect();
    let x = e.clientX - lr.left - offsetX;
    let y = e.clientY - lr.top - offsetY;
    x = Math.max(-10, Math.min(lr.width-10, x));
    y = Math.max(-10, Math.min(lr.height-10, y));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  el.addEventListener('pointerup', ()=> dragging=false);
  el.addEventListener('pointercancel', ()=> dragging=false);
}

document.getElementById('clearStickersBtn').addEventListener('click', ()=>{
  stickerLayer.innerHTML = '';
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  root.style.setProperty('--paper', paperColors[0]);
  root.style.setProperty('--seal', sealColors[0]);
  root.style.setProperty('--font-letter', fonts[0].value);
  document.querySelectorAll('.swatch').forEach((s,i)=>s.classList.toggle('active', false));
  document.querySelectorAll('#paperSwatches .swatch')[0].classList.add('active');
  document.querySelectorAll('#sealSwatches .swatch')[0].classList.add('active');
  document.querySelectorAll('.font-btn').forEach((b,i)=>b.classList.toggle('active', i===0));
  stickerLayer.innerHTML = '';
  document.getElementById('toField').textContent='';
  document.getElementById('messageField').textContent='';
  document.getElementById('fromField').textContent='';
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('downloadBtn');
  const original = btn.textContent;
  btn.textContent = 'Preparing your letter…';
  html2canvas(letter, {backgroundColor:null, scale:2}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'garden-letter.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = original;
  }).catch(()=>{ btn.textContent = original; });
});
</script>
</body>
</html>
